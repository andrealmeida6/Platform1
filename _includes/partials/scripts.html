<!-- Serviços Base (devem carregar primeiro) -->
<script src="{{ '/web-files/js/dataService.js' | relative_url }}"></script>
<script src="{{ '/web-files/js/authService.js' | relative_url }}"></script>
<script src="{{ '/web-files/js/themeService.js' | relative_url }}"></script>

<!-- Scripts da Aplicação -->
<script src="{{ '/web-files/js/app.js' | relative_url }}"></script>
<script src="{{ '/web-files/js/calendar.js' | relative_url }}"></script>

<!-- Inicialização Global -->
<script>
document.addEventListener('DOMContentLoaded', async function() {
  // Limpar chave antiga do localStorage (migração para v4)
  if (localStorage.getItem('platform1_current_user')) {
    console.log('[Init] A limpar chave antiga platform1_current_user...');
    localStorage.removeItem('platform1_current_user');
  }
  
  // Inicializar AuthService
  if (window.AuthService) {
    await AuthService.init();
    
    // Inicializar componente View As se existir
    if (window.initViewAsSelector) {
      await window.initViewAsSelector();
    }
    
    // Inicializar profile section se existir
    if (window.initProfileSection) {
      await window.initProfileSection();
    }
  }
  
  // Inicializar ThemeService (carrega e aplica tema da BD)
  if (window.ThemeService) {
    await ThemeService.init();
  }
});
</script>
