{% comment %}
  Modal: Boletim de Itinerário
  Power Pages: Web Template para modal de deslocação
{% endcomment %}

<div id="modalDeslocacao" class="modal-overlay" onclick="if(event.target === this) closeModal('modalDeslocacao')">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Boletim de Itinerário</h2>
      <button class="modal-close" onclick="closeModal('modalDeslocacao')">×</button>
    </div>
    <form id="formDeslocacao" onsubmit="event.preventDefault(); submitDeslocacao();">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Data da Deslocação *</label>
          <input type="date" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">Origem *</label>
          <input type="text" class="form-input" placeholder="Local de partida..." required>
        </div>

        <div class="form-group">
          <label class="form-label">Destino *</label>
          <input type="text" class="form-input" placeholder="Local de destino..." required>
        </div>

        <div class="form-group">
          <label class="form-label">Quilómetros (Km) *</label>
          <input type="number" class="form-input" min="0" step="0.1" required>
        </div>

        <div class="form-group">
          <label class="form-label">Motivo da Deslocação *</label>
          <textarea class="form-textarea" placeholder="Descreva o motivo..." required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modalDeslocacao')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Submeter Boletim</button>
      </div>
    </form>
  </div>
</div>
