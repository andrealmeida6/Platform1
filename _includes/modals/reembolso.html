<!-- Modal: Reembolso -->
<div id="modalReembolso" class="modal-overlay">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Pedido de Reembolso</h2>
      <button class="modal-close" onclick="closeModal('modalReembolso')">×</button>
    </div>
    <form id="formReembolso" onsubmit="event.preventDefault(); submitReembolso();">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Tipo de Despesa *</label>
          <select class="form-select" required>
            <option value="">Selecione...</option>
            <option value="transporte">Transporte</option>
            <option value="alimentacao">Alimentação</option>
            <option value="alojamento">Alojamento</option>
            <option value="material">Material</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Data da Despesa *</label>
          <input type="date" class="form-input" required>
        </div>

        <div class="form-group">
          <label class="form-label">Valor (€) *</label>
          <input type="number" class="form-input" min="0.01" step="0.01" placeholder="0.00" required>
        </div>

        <div class="form-group">
          <label class="form-label">Descrição *</label>
          <textarea class="form-textarea" placeholder="Descreva a despesa..." required></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">Anexar Comprovativo (PDF/Imagem) *</label>
          <input type="file" class="form-file-input" accept=".pdf,.jpg,.jpeg,.png" required>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modalReembolso')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Submeter Pedido</button>
      </div>
    </form>
  </div>
</div>
