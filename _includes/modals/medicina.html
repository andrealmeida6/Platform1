<!-- Modal: Medicina no Trabalho -->
<div id="modalMedicina" class="modal-overlay" style="display: none;">
  <div class="modal-content">
    <div class="modal-header">
      <h2 class="modal-title">Agendar Consulta - Medicina no Trabalho</h2>
      <button class="modal-close" onclick="closeModal('modalMedicina')">×</button>
    </div>
    <form id="formMedicina" onsubmit="event.preventDefault(); submitMedicina();">
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Tipo de Consulta *</label>
          <select id="medicinaTipoConsulta" class="form-select" required>
            <option value="">Selecione o tipo...</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Data Preferencial *</label>
          <input type="date" id="medicinaData" class="form-input" required min="">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Hora Início Preferencial *</label>
            <input type="time" id="medicinaHoraInicio" class="form-input" required>
          </div>
          <div class="form-group">
            <label class="form-label">Hora Fim</label>
            <input type="time" id="medicinaHoraFim" class="form-input">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Observações</label>
          <textarea id="medicinaObservacoes" class="form-textarea" rows="3" placeholder="Informações adicionais (opcional)..."></textarea>
        </div>
        
        <div class="form-info-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>O pedido será submetido e será contactado para confirmação da data e hora definitivas.</span>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" onclick="closeModal('modalMedicina')">Cancelar</button>
        <button type="submit" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Agendar Consulta
        </button>
      </div>
    </form>
  </div>
</div>

<style>
#modalMedicina .form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

#modalMedicina .form-info-box {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 1rem;
  background: #f0f9ff;
  border-radius: 10px;
  border: 1px solid #bae6fd;
  margin-top: 0.5rem;
}

#modalMedicina .form-info-box svg {
  width: 20px;
  height: 20px;
  color: #0284c7;
  flex-shrink: 0;
  margin-top: 2px;
}

#modalMedicina .form-info-box span {
  font-size: 0.8rem;
  color: #0369a1;
  line-height: 1.4;
}

@media (max-width: 480px) {
  #modalMedicina .form-row {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
// Inicializar modal de medicina quando abrir
async function initMedicinaModal() {
  // Aguardar serviços
  while (typeof DataService === 'undefined') {
    await new Promise(resolve => setTimeout(resolve, 100));
  }
  
  try {
    // Carregar tipos de consulta
    const tipos = await DataService.query('tipos_consulta_medicina', {
      filters: [{ column: 'ativo', operator: 'eq', value: true }],
      orderBy: { column: 'ordem', ascending: true }
    });
    
    const select = document.getElementById('medicinaTipoConsulta');
    if (select && tipos) {
      select.innerHTML = '<option value="">Selecione o tipo...</option>';
      tipos.forEach(tipo => {
        select.innerHTML += `<option value="${tipo.id}">${tipo.nome}</option>`;
      });
    }
    
    // Definir data mínima como hoje
    const dataInput = document.getElementById('medicinaData');
    if (dataInput) {
      const hoje = new Date().toISOString().split('T')[0];
      dataInput.min = hoje;
      dataInput.value = '';
    }
    
  } catch (error) {
    console.error('[Medicina Modal] Erro ao carregar tipos:', error);
  }
}

// Submeter pedido de consulta
async function submitMedicina() {
  try {
    // Aguardar serviços
    while (typeof AuthService === 'undefined' || typeof DataService === 'undefined') {
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    
    const currentUser = await AuthService.getCurrentUser();
    if (!currentUser) {
      showToast('Erro: Utilizador não autenticado', 'error');
      return;
    }
    
    const dados = {
      colaborador_id: currentUser.id,
      tipo_consulta_id: document.getElementById('medicinaTipoConsulta').value,
      data_marcacao: document.getElementById('medicinaData').value,
      hora_inicio: document.getElementById('medicinaHoraInicio').value,
      hora_fim: document.getElementById('medicinaHoraFim').value || null,
      observacoes: document.getElementById('medicinaObservacoes').value || null,
      estado: 'Agendada',
      agendado_por: currentUser.id
    };
    
    // Validar campos obrigatórios
    if (!dados.tipo_consulta_id || !dados.data_marcacao || !dados.hora_inicio) {
      showToast('Por favor preencha todos os campos obrigatórios', 'error');
      return;
    }
    
    // Criar consulta
    await DataService.insert('consultas_medicina', dados);
    
    showToast('Consulta agendada com sucesso! Será contactado para confirmação.', 'success');
    closeModal('modalMedicina');
    document.getElementById('formMedicina').reset();
    
    // Se estiver na página de medicina, recarregar dados
    if (typeof carregarDados === 'function') {
      await carregarDados();
    }
    
  } catch (error) {
    console.error('[Medicina] Erro ao agendar consulta:', error);
    showToast('Erro ao agendar consulta. Tente novamente.', 'error');
  }
}

// Inicializar quando o modal for aberto
document.addEventListener('DOMContentLoaded', function() {
  const modal = document.getElementById('modalMedicina');
  if (modal) {
    // Usar MutationObserver para detectar quando o modal é mostrado
    const observer = new MutationObserver(function(mutations) {
      mutations.forEach(function(mutation) {
        if (mutation.type === 'attributes' && mutation.attributeName === 'style') {
          if (modal.style.display !== 'none') {
            initMedicinaModal();
          }
        }
      });
    });
    observer.observe(modal, { attributes: true });
  }
});

// Função para abrir o modal (usada pelo quick-actions)
function openMedicinaModal() {
  const modal = document.getElementById('modalMedicina');
  if (modal) {
    modal.style.display = 'flex';
    initMedicinaModal();
  }
}
</script>
