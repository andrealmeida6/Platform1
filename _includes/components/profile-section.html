<style>

<script>
// Atualizar interface do perfil com dados do utilizador
function updateProfileUI(user) {
  if (!user) {
    console.warn('[ProfileSection] Utilizador não fornecido');
    return;
  }
  
  console.log('[ProfileSection] A atualizar UI com:', user.nome);
  
  // Nome
  const profileName = document.getElementById('profileName');
  if (profileName) {
    profileName.textContent = user.nome || 'Utilizador';
  }
  
  // Avatar (iniciais)
  const profileAvatar = document.getElementById('profileAvatar');
  if (profileAvatar) {
    const initials = (user.nome || 'U')
      .split(' ')
      .map(n => n[0])
      .slice(0, 2)
      .join('')
      .toUpperCase();
    profileAvatar.textContent = initials;
  }
  
  // Email
  const profileEmail = document.getElementById('profileEmail');
  if (profileEmail) {
    profileEmail.textContent = user.email || '-';
  }
  
  // Telefone
  const profileTelefone = document.getElementById('profileTelefone');
  if (profileTelefone) {
    profileTelefone.textContent = user.telefone || '-';
  }
  
  // Departamento/Unidade Orgânica
  const profileDepartamento = document.getElementById('profileDepartamento');
  if (profileDepartamento) {
    const deptNome = user.departamentos?.nome || user.departamento_nome || '-';
    profileDepartamento.textContent = deptNome;
  }
  
  // Número do Colaborador
  const profileNumero = document.getElementById('profileNumero');
  if (profileNumero) {
    profileNumero.textContent = user.numero_colaborador || '-';
  }
  
  // Status
  const profileStatus = document.getElementById('profileStatus');
  const profileStatusText = document.getElementById('profileStatusText');
  if (profileStatus && profileStatusText) {
    if (user.ativo) {
      profileStatus.className = 'profile-status active';
      profileStatusText.textContent = 'Ativo';
    } else {
      profileStatus.className = 'profile-status inactive';
      profileStatusText.textContent = 'Inativo';
    }
  }
}

// Inicializar secção de perfil com dados do utilizador atual
async function initProfileSection() {
  // Aguardar que AuthService esteja disponível
  if (typeof AuthService === 'undefined') {
    console.log('[ProfileSection] Aguardando AuthService...');
    setTimeout(initProfileSection, 100);
    return;
  }
  
  try {
    console.log('[ProfileSection] A carregar dados do utilizador...');
    
    const currentUser = await AuthService.getCurrentUser();
    
    if (currentUser) {
      updateProfileUI(currentUser);
      console.log('[ProfileSection] Perfil carregado:', currentUser.nome);
    } else {
      console.warn('[ProfileSection] Utilizador não encontrado');
    }
  } catch (error) {
    console.error('[ProfileSection] Erro ao carregar perfil:', error);
  }
}

// Escutar evento de mudança de utilizador (quando "Ver como" muda)
document.addEventListener('userChanged', function(event) {
  console.log('[ProfileSection] Evento userChanged recebido');
  if (event.detail && event.detail.user) {
    updateProfileUI(event.detail.user);
  }
});

// Inicializar quando o DOM estiver pronto
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() {
    // Pequeno delay para garantir que AuthService já inicializou
    setTimeout(initProfileSection, 200);
  });
} else {
  setTimeout(initProfileSection, 200);
}

// Expor funções para uso global
window.initProfileSection = initProfileSection;
window.updateProfileUI = updateProfileUI;
</script>
