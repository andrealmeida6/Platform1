<!-- Header com navegação e seletor "Ver como" -->
<header class="app-header">
  <div class="header-left">
    <a href="{{ '/' | relative_url }}" class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Platform1</span>
    </a>
    
    <nav class="header-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <span>Início</span>
      </a>
      <a href="{{ '/deslocacoes' | relative_url }}" class="nav-link {% if page.url contains 'deslocacoes' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        <span>Deslocações</span>
      </a>
      <a href="{{ '/formacao' | relative_url }}" class="nav-link {% if page.url contains 'formacao' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span>Formação</span>
      </a>
      <a href="{{ '/backoffice' | relative_url }}" class="nav-link nav-link-admin {% if page.url contains 'backoffice' %}active{% endif %}" id="navBackoffice" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span>Backoffice</span>
      </a>
    </nav>
  </div>
  
  <div class="header-right">
    <!-- View As Selector -->
    <div class="view-as-container" id="viewAsContainer" style="display: none;">
      <div class="view-as-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Ver como:</span>
      </div>
      <select class="view-as-select" id="viewAsSelect" onchange="handleViewAsChange(this.value)">
        <option value="">-- Eu mesmo --</option>
      </select>
      <button class="view-as-clear" id="viewAsClear" onclick="handleClearViewAs()" title="Voltar à minha conta" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <!-- View As Indicator -->
    <div class="view-as-indicator" id="viewAsIndicator" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span>A ver como: <strong id="viewAsName"></strong></span>
    </div>
    
    <!-- Current User -->
    <div class="header-user" id="headerUser">
      <div class="user-avatar" id="userAvatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </div>
      <div class="user-info">
        <span class="user-name" id="userName">Carregando...</span>
        <span class="user-role" id="userRole"></span>
      </div>
    </div>
  </div>
</header>

<script>
// Popula o seletor "Ver como"
async function initViewAsSelector() {
  try {
    const realUser = await AuthService.getRealUser();
    const currentUser = await AuthService.getCurrentUser();
    
    // Atualizar info do utilizador no header
    if (currentUser) {
      document.getElementById('userName').textContent = currentUser.nome;
      const roles = currentUser.roles || [];
      const roleNames = roles.map(r => r.nome).join(', ');
      document.getElementById('userRole').textContent = roleNames || 'Sem role';
      
      // Iniciais no avatar
      const initials = currentUser.nome.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
      document.getElementById('userAvatar').innerHTML = `<span>${initials}</span>`;
    }
    
    // Verificar se utilizador real pode usar "Ver como" (apenas admin)
    if (realUser && AuthService.isAdmin(realUser)) {
      const container = document.getElementById('viewAsContainer');
      const select = document.getElementById('viewAsSelect');
      const navBackoffice = document.getElementById('navBackoffice');
      
      if (container && select) {
        container.style.display = 'flex';
        
        // Carregar colaboradores
        const colaboradores = await AuthService.getColaboradoresComRoles();
        
        colaboradores.forEach(c => {
          const option = document.createElement('option');
          option.value = c.id;
          const roleNames = (c.roles || []).map(r => r.codigo).join(', ');
          option.textContent = `${c.nome} (${roleNames || 'sem role'})`;
          option.selected = (AuthService.isViewAsActive() && currentUser && c.id === currentUser.id);
          select.appendChild(option);
        });
        
        // Mostrar indicador se "Ver como" está ativo
        updateViewAsIndicator();
      }
      
      // Mostrar link do backoffice
      if (navBackoffice) {
        navBackoffice.style.display = 'flex';
      }
    }
    
    // Mostrar backoffice se utilizador atual tem permissão
    if (currentUser && AuthService.canAccessBackoffice(currentUser)) {
      const navBackoffice = document.getElementById('navBackoffice');
      if (navBackoffice) {
        navBackoffice.style.display = 'flex';
      }
    }
    
  } catch (error) {
    console.error('[Header] Erro ao inicializar:', error);
  }
}

function updateViewAsIndicator() {
  const indicator = document.getElementById('viewAsIndicator');
  const clearBtn = document.getElementById('viewAsClear');
  const viewAsName = document.getElementById('viewAsName');
  
  if (AuthService.isViewAsActive()) {
    const viewAsUser = AuthService.getViewAsUser();
    if (viewAsUser && indicator && viewAsName) {
      indicator.style.display = 'flex';
      viewAsName.textContent = viewAsUser.nome;
    }
    if (clearBtn) clearBtn.style.display = 'flex';
  } else {
    if (indicator) indicator.style.display = 'none';
    if (clearBtn) clearBtn.style.display = 'none';
  }
}

async function handleViewAsChange(colaboradorId) {
  if (colaboradorId) {
    await AuthService.setViewAs(colaboradorId);
  } else {
    AuthService.clearViewAs();
  }
  
  // Recarregar página para aplicar novas permissões
  window.location.reload();
}

function handleClearViewAs() {
  AuthService.clearViewAs();
  window.location.reload();
}

// Expor para uso global
window.initViewAsSelector = initViewAsSelector;
</script>
