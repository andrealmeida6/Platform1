<!-- Header com navegação e seletor "Ver como" -->
<header class="app-header">
  <div class="header-left">
    <a href="{{ '/' | relative_url }}" class="header-logo" id="headerLogo" data-theme-logo>
      <!-- Logo padrão - será substituído pelo ThemeService se configurado -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="default-logo-icon">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="default-logo-text">Platform1</span>
    </a>
    
    <nav class="header-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <span>Início</span>
      </a>
      <a href="{{ '/deslocacoes' | relative_url }}" class="nav-link {% if page.url contains 'deslocacoes' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        <span>Deslocações</span>
      </a>
      <a href="{{ '/formacao' | relative_url }}" class="nav-link {% if page.url contains 'formacao' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span>Formação</span>
      </a>
      <a href="{{ '/backoffice' | relative_url }}" class="nav-link nav-link-admin {% if page.url contains 'backoffice' %}active{% endif %}" id="navBackoffice" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span>Backoffice</span>
      </a>
      <!-- Link para Configuração de Tema (apenas admin) -->
      <a href="{{ '/configuracao-tema' | relative_url }}" class="nav-link nav-link-admin {% if page.url contains 'configuracao-tema' %}active{% endif %}" id="navConfigTema" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
          <line x1="21.17" y1="8" x2="12" y2="8"/>
          <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
          <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
        </svg>
        <span>Tema</span>
      </a>
    </nav>
  </div>
  
  <div class="header-right">
    <!-- View As Selector -->
    <div class="view-as-container" id="viewAsContainer" style="display: none;">
      <div class="view-as-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Ver como:</span>
      </div>
      <select class="view-as-select" id="viewAsSelect">
        <option value="">-- Eu mesmo --</option>
      </select>
      <button class="view-as-clear" id="viewAsClear" title="Voltar à minha conta" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <!-- View As Indicator -->
    <div class="view-as-indicator" id="viewAsIndicator" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span>A ver como: <strong id="viewAsName"></strong></span>
    </div>
    
    <!-- Current User -->
    <div class="header-user-wrapper">
      <div class="header-user" id="headerUser" onclick="toggleUserPanel(event)">
        <div class="user-avatar" id="userAvatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="user-info">
          <span class="user-name" id="userName">A carregar...</span>
          <span class="user-role" id="userRole"></span>
        </div>
        <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      
      <!-- User Panel Dropdown -->
      <div class="user-panel" id="userPanel">
        <div class="user-panel-header">
          <div class="user-panel-name" id="panelUserName">Utilizador</div>
          <div class="user-panel-role" id="panelUserRole">-</div>
        </div>
        <div class="user-panel-section-title">Menu Rápido</div>
        <div class="user-actions">
          <!-- Meu Perfil -->
          <button class="user-action-btn" onclick="openProfile()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Meu Perfil
          </button>
          
          <!-- Documentos em Assinatura -->
          <button class="user-action-btn" onclick="openDocumentosAssinatura()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <path d="M12 18v-6"></path>
              <path d="M9 15l3 3 3-3"></path>
            </svg>
            Documentos em Assinatura
          </button>
          
          <!-- Aprovação de Deslocações -->
          <button class="user-action-btn" onclick="openAprovacaoDeslocacoes()" id="btnAprovacoes" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Aprovação de Deslocações
          </button>
          
          <!-- Pedidos de Deslocações -->
          <button class="user-action-btn" onclick="openPedidosDeslocacoes()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
            </svg>
            Pedidos de Deslocações
          </button>
          
          <!-- Boletins de Itinerário -->
          <button class="user-action-btn" onclick="openBoletinsItinerario()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            Boletins de Itinerário
          </button>
          
          <!-- Pedir Reembolsos -->
          <button class="user-action-btn" onclick="openPedirReembolsos()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
              <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
            Pedir Reembolsos
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
// Variável para armazenar o ID do utilizador atual
var loggedUserCurrentId = null;

// Toggle do painel do utilizador
function toggleUserPanel(event) {
  event.stopPropagation();
  var panel = document.getElementById('userPanel');
  if (panel) {
    panel.classList.toggle('show');
  }
}

// Fechar painel quando clicar fora
document.addEventListener('click', function(event) {
  var panel = document.getElementById('userPanel');
  var wrapper = document.querySelector('.header-user-wrapper');
  if (panel && wrapper && !wrapper.contains(event.target)) {
    panel.classList.remove('show');
  }
});

// Funções de navegação do User Panel
function openProfile() {
  if (loggedUserCurrentId) {
    window.location.href = '{{ "/perfil" | relative_url }}?id=' + loggedUserCurrentId;
  }
  closeUserPanel();
}

function openDocumentosAssinatura() {
  // TODO: Implementar página de documentos em assinatura
  window.location.href = '{{ "/documentos-assinatura" | relative_url }}';
  closeUserPanel();
}

function openAprovacaoDeslocacoes() {
  window.location.href = '{{ "/deslocacoes" | relative_url }}';
  closeUserPanel();
}

function openPedidosDeslocacoes() {
  window.location.href = '{{ "/deslocacoes" | relative_url }}';
  closeUserPanel();
}

function openBoletinsItinerario() {
  window.location.href = '{{ "/deslocacoes" | relative_url }}';
  closeUserPanel();
}

function openPedirReembolsos() {
  // Abrir modal de reembolso se existir, senão navegar
  if (typeof openModal === 'function') {
    openModal('modalReembolso');
  } else {
    window.location.href = '{{ "/reembolsos" | relative_url }}';
  }
  closeUserPanel();
}

function closeUserPanel() {
  var panel = document.getElementById('userPanel');
  if (panel) {
    panel.classList.remove('show');
  }
}

// Atualizar UI do header com dados do utilizador
function updateHeaderUserUI(user) {
  if (!user) return;
  
  console.log('[Header] A atualizar UI com:', user.nome);
  
  // Guardar ID do utilizador
  loggedUserCurrentId = user.id;
  
  const userName = document.getElementById('userName');
  const userRole = document.getElementById('userRole');
  const userAvatar = document.getElementById('userAvatar');
  const panelUserName = document.getElementById('panelUserName');
  const panelUserRole = document.getElementById('panelUserRole');
  
  const nome = user.nome || 'Utilizador';
  const roles = user.roles || [];
  const roleNames = roles.map(r => r.codigo || r.nome).join(', ');
  const rolePrimario = roles.length > 0 ? (roles[0].codigo || roles[0].nome) : 'Sem role';
  
  if (userName) {
    userName.textContent = nome;
  }
  
  if (userRole) {
    userRole.textContent = roleNames || 'Sem role';
  }
  
  if (userAvatar) {
    const initials = nome.split(' ').map(n => n[0]).slice(0, 2).join('').toUpperCase();
    userAvatar.innerHTML = '<span>' + initials + '</span>';
  }
  
  // Atualizar painel
  if (panelUserName) {
    panelUserName.textContent = nome;
  }
  
  if (panelUserRole) {
    panelUserRole.textContent = rolePrimario;
  }
  
  // Mostrar botão de aprovações se tiver permissão
  var btnAprovacoes = document.getElementById('btnAprovacoes');
  if (btnAprovacoes) {
    // Verificar se pode aprovar (dirigente, núcleo, admin)
    var canApprove = roles.some(function(r) {
      var codigo = (r.codigo || '').toLowerCase();
      return codigo === 'nucleo' || codigo === 'afr_dirigente' || codigo === 'admin';
    });
    btnAprovacoes.style.display = canApprove ? 'flex' : 'none';
  }
}

// Popula o seletor "Ver como"
async function initViewAsSelector() {
  // Aguardar que DataService esteja disponível
  if (typeof DataService === 'undefined' || typeof AuthService === 'undefined') {
    console.log('[Header] Aguardando serviços...');
    setTimeout(initViewAsSelector, 100);
    return;
  }
  
  try {
    console.log('[Header] Inicializando...');
    
    const realUser = await AuthService.getRealUser();
    const currentUser = await AuthService.getCurrentUser();
    
    console.log('[Header] Utilizador atual:', currentUser?.nome);
    
    // Atualizar info do utilizador no header
    if (currentUser) {
      updateHeaderUserUI(currentUser);
    }
    
    // Verificar se utilizador real pode usar "Ver como" (apenas admin)
    if (realUser && AuthService.isAdmin(realUser)) {
      const container = document.getElementById('viewAsContainer');
      const select = document.getElementById('viewAsSelect');
      const navBackoffice = document.getElementById('navBackoffice');
      const navConfigTema = document.getElementById('navConfigTema');
      
      if (container && select) {
        container.style.display = 'flex';
        
        // Carregar colaboradores
        const colaboradores = await AuthService.getColaboradoresComRoles();
        console.log('[Header] Colaboradores carregados:', colaboradores.length);
        
        // Limpar opções existentes (exceto a primeira)
        while (select.options.length > 1) {
          select.remove(1);
        }
        
        colaboradores.forEach(function(c) {
          var option = document.createElement('option');
          option.value = c.id;
          var roleNames = (c.roles || []).map(function(r) { return r.codigo; }).join(', ');
          option.textContent = c.nome + ' (' + (roleNames || 'sem role') + ')';
          if (AuthService.isViewAsActive() && currentUser && c.id === currentUser.id) {
            option.selected = true;
          }
          select.appendChild(option);
        });
        
        // Adicionar event listener
        select.onchange = function() {
          handleViewAsChange(this.value);
        };
        
        // Mostrar indicador se "Ver como" está ativo
        updateViewAsIndicator();
      }
      
      // Mostrar link do backoffice
      if (navBackoffice) {
        navBackoffice.style.display = 'flex';
      }
      
      // Mostrar link de configuração de tema
      if (navConfigTema) {
        navConfigTema.style.display = 'flex';
      }
    }
    
    // Mostrar backoffice se utilizador atual tem permissão
    if (currentUser && AuthService.canAccessBackoffice(currentUser)) {
      var navBackoffice = document.getElementById('navBackoffice');
      if (navBackoffice) {
        navBackoffice.style.display = 'flex';
      }
    }
    
    // Mostrar config tema se utilizador atual tem permissão de gestão de formações (ou admin)
    if (currentUser && (AuthService.isAdmin(currentUser) || AuthService.canAccessFormacaoManagement(currentUser))) {
      var navConfigTema = document.getElementById('navConfigTema');
      if (navConfigTema) {
        navConfigTema.style.display = 'flex';
      }
    }
    
    // Setup do botão clear
    var clearBtn = document.getElementById('viewAsClear');
    if (clearBtn) {
      clearBtn.onclick = handleClearViewAs;
    }
    
    console.log('[Header] Inicializado com sucesso');
    
  } catch (error) {
    console.error('[Header] Erro ao inicializar:', error);
  }
}

function updateViewAsIndicator() {
  var indicator = document.getElementById('viewAsIndicator');
  var clearBtn = document.getElementById('viewAsClear');
  var viewAsName = document.getElementById('viewAsName');
  
  if (AuthService.isViewAsActive()) {
    var viewAsUser = AuthService.getViewAsUser();
    if (viewAsUser && indicator && viewAsName) {
      indicator.style.display = 'flex';
      viewAsName.textContent = viewAsUser.nome;
    }
    if (clearBtn) clearBtn.style.display = 'flex';
  } else {
    if (indicator) indicator.style.display = 'none';
    if (clearBtn) clearBtn.style.display = 'none';
  }
}

async function handleViewAsChange(colaboradorId) {
  if (colaboradorId) {
    await AuthService.setViewAs(colaboradorId);
  } else {
    AuthService.clearViewAs();
  }
  
  // Recarregar página para aplicar novas permissões
  window.location.reload();
}

function handleClearViewAs() {
  AuthService.clearViewAs();
  window.location.reload();
}

// Escutar evento de mudança de utilizador
document.addEventListener('userChanged', function(event) {
  console.log('[Header] Evento userChanged recebido');
  if (event.detail && event.detail.user) {
    updateHeaderUserUI(event.detail.user);
    updateViewAsIndicator();
  }
});

// Expor para uso global
window.initViewAsSelector = initViewAsSelector;
window.updateHeaderUserUI = updateHeaderUserUI;
window.loggedUserCurrentId = loggedUserCurrentId;
</script>
