<!-- Header com navegação e seletor "Ver como" -->
<header class="app-header">
  <div class="header-left">
    <a href="{{ '/' | relative_url }}" class="header-logo" id="headerLogo" data-theme-logo>
      <!-- Logo padrão - será substituído pelo ThemeService se configurado -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="default-logo-icon">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="default-logo-text">Platform1</span>
    </a>
    
    <nav class="header-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <span>Início</span>
      </a>
      <a href="{{ '/deslocacoes' | relative_url }}" class="nav-link {% if page.url contains 'deslocacoes' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        <span>Deslocações</span>
      </a>
      <a href="{{ '/formacao' | relative_url }}" class="nav-link {% if page.url contains 'formacao' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
        <span>Formação</span>
      </a>
      <a href="{{ '/medicina-trabalho' | relative_url }}" class="nav-link {% if page.url contains 'medicina' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/>
        </svg>
        <span>Medicina</span>
      </a>
      <a href="{{ '/finance-hub' | relative_url }}" class="nav-link {% if page.url contains 'finance-hub' or page.url contains 'relatorio-contas' %}active{% endif %}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="12" y1="1" x2="12" y2="23"/>
          <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/>
        </svg>
        <span>Finance Hub</span>
      </a>
      <a href="{{ '/backoffice' | relative_url }}" class="nav-link nav-link-admin {% if page.url contains 'backoffice' %}active{% endif %}" id="navBackoffice" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span>Backoffice</span>
      </a>
      <!-- Link para Configuração de Tema (apenas admin) -->
      <a href="{{ '/configuracao-tema' | relative_url }}" class="nav-link nav-link-admin {% if page.url contains 'configuracao-tema' %}active{% endif %}" id="navConfigTema" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="4"/>
          <line x1="21.17" y1="8" x2="12" y2="8"/>
          <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
          <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
        </svg>
        <span>Tema</span>
      </a>
    </nav>
  </div>
  
  <div class="header-right">
    <!-- View As Selector -->
    <div class="view-as-container" id="viewAsContainer" style="display: none;">
      <div class="view-as-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        <span>Ver como:</span>
      </div>
      <select class="view-as-select" id="viewAsSelect">
        <option value="">-- Eu mesmo --</option>
      </select>
      <button class="view-as-clear" id="viewAsClear" title="Voltar à minha conta" style="display: none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    
    <!-- View As Indicator -->
    <div class="view-as-indicator" id="viewAsIndicator" style="display: none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span>A ver como: <strong id="viewAsName"></strong></span>
    </div>
    
    <!-- Current User -->
    <div class="header-user-wrapper">
      <div class="header-user" id="headerUser" onclick="toggleUserPanel(event)">
        <div class="user-avatar" id="userAvatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="user-info">
          <span class="user-name" id="userName">A carregar...</span>
          <span class="user-role" id="userRole"></span>
        </div>
        <svg class="user-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"/>
        </svg>
      </div>
      
      <!-- User Panel Dropdown -->
      <div class="user-panel" id="userPanel">
        <div class="user-panel-header">
          <div class="user-panel-name" id="panelUserName">Utilizador</div>
          <div class="user-panel-role" id="panelUserRole">-</div>
        </div>
        <div class="user-panel-section-title">Menu Rápido</div>
        <div class="user-actions">
          <button class="user-action-btn" onclick="openProfile()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            Meu Perfil
          </button>
          <button class="user-action-btn" onclick="openDocumentosAssinatura()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><path d="M12 18v-6"></path><path d="M9 15l3 3 3-3"></path></svg>
            Documentos em Assinatura
          </button>
          <button class="user-action-btn" onclick="openAprovacaoDeslocacoes()" id="btnAprovacoes" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>
            Aprovação de Deslocações
          </button>
          <button class="user-action-btn" onclick="openPedidosDeslocacoes()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon></svg>
            Pedidos de Deslocações
          </button>
          <button class="user-action-btn" onclick="openBoletinsItinerario()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            Boletins de Itinerário
          </button>
          <button class="user-action-btn" onclick="openPedirReembolsos()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
            Pedir Reembolsos
          </button>
          <button class="user-action-btn" onclick="openMedicinaTrabaho()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"></path></svg>
            Medicina no Trabalho
          </button>
        </div>
      </div>
    </div>
  </div>
</header>

<script>
var loggedUserCurrentId = null;
function toggleUserPanel(event) { event.stopPropagation(); var panel = document.getElementById('userPanel'); if (panel) panel.classList.toggle('show'); }
document.addEventListener('click', function(event) { var panel = document.getElementById('userPanel'); var wrapper = document.querySelector('.header-user-wrapper'); if (panel && wrapper && !wrapper.contains(event.target)) panel.classList.remove('show'); });
function openProfile() { if (loggedUserCurrentId) window.location.href = '{{ "/perfil" | relative_url }}?id=' + loggedUserCurrentId; closeUserPanel(); }
function openDocumentosAssinatura() { window.location.href = '{{ "/documentos-assinatura" | relative_url }}'; closeUserPanel(); }
function openAprovacaoDeslocacoes() { window.location.href = '{{ "/deslocacoes" | relative_url }}'; closeUserPanel(); }
function openPedidosDeslocacoes() { window.location.href = '{{ "/deslocacoes" | relative_url }}'; closeUserPanel(); }
function openBoletinsItinerario() { window.location.href = '{{ "/deslocacoes" | relative_url }}'; closeUserPanel(); }
function openPedirReembolsos() { if (typeof openModal === 'function') openModal('modalReembolso'); else window.location.href = '{{ "/reembolsos" | relative_url }}'; closeUserPanel(); }
function openMedicinaTrabaho() { window.location.href = '{{ "/medicina-trabalho" | relative_url }}'; closeUserPanel(); }
function closeUserPanel() { var panel = document.getElementById('userPanel'); if (panel) panel.classList.remove('show'); }
function updateHeaderUserUI(user) { if (!user) return; loggedUserCurrentId = user.id; var userName = document.getElementById('userName'); var userRole = document.getElementById('userRole'); var userAvatar = document.getElementById('userAvatar'); var panelUserName = document.getElementById('panelUserName'); var panelUserRole = document.getElementById('panelUserRole'); var nome = user.nome || 'Utilizador'; var roles = user.roles || []; var roleNames = roles.map(function(r){return r.codigo||r.nome}).join(', '); var rolePrimario = roles.length > 0 ? (roles[0].codigo || roles[0].nome) : 'Sem role'; if (userName) userName.textContent = nome; if (userRole) userRole.textContent = roleNames || 'Sem role'; if (userAvatar) { var initials = nome.split(' ').map(function(n){return n[0]}).slice(0,2).join('').toUpperCase(); userAvatar.innerHTML = '<span>' + initials + '</span>'; } if (panelUserName) panelUserName.textContent = nome; if (panelUserRole) panelUserRole.textContent = rolePrimario; var btnAprovacoes = document.getElementById('btnAprovacoes'); if (btnAprovacoes) { var canApprove = roles.some(function(r){ var codigo = (r.codigo||'').toLowerCase(); return codigo==='nucleo'||codigo==='afr_dirigente'||codigo==='admin'; }); btnAprovacoes.style.display = canApprove ? 'flex' : 'none'; } }
async function initViewAsSelector() { if (typeof DataService === 'undefined' || typeof AuthService === 'undefined') { setTimeout(initViewAsSelector, 100); return; } try { var realUser = await AuthService.getRealUser(); var currentUser = await AuthService.getCurrentUser(); if (currentUser) updateHeaderUserUI(currentUser); if (realUser && AuthService.isAdmin(realUser)) { var container = document.getElementById('viewAsContainer'); var select = document.getElementById('viewAsSelect'); var navBackoffice = document.getElementById('navBackoffice'); var navConfigTema = document.getElementById('navConfigTema'); if (container && select) { container.style.display = 'flex'; var colaboradores = await AuthService.getColaboradoresComRoles(); while (select.options.length > 1) select.remove(1); colaboradores.forEach(function(c){ var option = document.createElement('option'); option.value = c.id; var rn = (c.roles||[]).map(function(r){return r.codigo}).join(', '); option.textContent = c.nome + ' (' + (rn||'sem role') + ')'; if (AuthService.isViewAsActive() && currentUser && c.id === currentUser.id) option.selected = true; select.appendChild(option); }); select.onchange = function(){ handleViewAsChange(this.value); }; updateViewAsIndicator(); } if (navBackoffice) navBackoffice.style.display = 'flex'; if (navConfigTema) navConfigTema.style.display = 'flex'; } if (currentUser && AuthService.canAccessBackoffice(currentUser)) { var nb = document.getElementById('navBackoffice'); if (nb) nb.style.display = 'flex'; } if (currentUser && (AuthService.isAdmin(currentUser) || AuthService.canAccessFormacaoManagement(currentUser))) { var nt = document.getElementById('navConfigTema'); if (nt) nt.style.display = 'flex'; } var clearBtn = document.getElementById('viewAsClear'); if (clearBtn) clearBtn.onclick = handleClearViewAs; } catch (error) { console.error('[Header] Erro:', error); } }
function updateViewAsIndicator() { var indicator = document.getElementById('viewAsIndicator'); var clearBtn = document.getElementById('viewAsClear'); var viewAsName = document.getElementById('viewAsName'); if (AuthService.isViewAsActive()) { var viewAsUser = AuthService.getViewAsUser(); if (viewAsUser && indicator && viewAsName) { indicator.style.display = 'flex'; viewAsName.textContent = viewAsUser.nome; } if (clearBtn) clearBtn.style.display = 'flex'; } else { if (indicator) indicator.style.display = 'none'; if (clearBtn) clearBtn.style.display = 'none'; } }
async function handleViewAsChange(colaboradorId) { if (colaboradorId) await AuthService.setViewAs(colaboradorId); else AuthService.clearViewAs(); window.location.reload(); }
function handleClearViewAs() { AuthService.clearViewAs(); window.location.reload(); }
document.addEventListener('userChanged', function(event) { if (event.detail && event.detail.user) { updateHeaderUserUI(event.detail.user); updateViewAsIndicator(); } });
window.initViewAsSelector = initViewAsSelector;
window.updateHeaderUserUI = updateHeaderUserUI;
window.loggedUserCurrentId = loggedUserCurrentId;
</script>
