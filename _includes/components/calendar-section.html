<!-- Calendar Section -->
<div class="calendar-section">
  <div class="calendar-cards">
    <div class="calendar-card green">
      <div class="calendar-card-label">Deslocações</div>
      <div class="calendar-card-number">18</div>
      <div class="calendar-card-info">Próxima: 22/11</div>
    </div>

    <div class="calendar-card blue">
      <div class="calendar-card-label">Medicina no Trabalho</div>
      <div class="calendar-card-number">2</div>
      <div class="calendar-card-info">Próxima: 28/11</div>
    </div>

    <div class="calendar-card orange">
      <div class="calendar-card-label">Formações</div>
      <div class="calendar-card-number">5</div>
      <div class="calendar-card-info">Próxima: 15/01</div>
    </div>

    <div class="calendar-card purple">
      <div class="calendar-card-label">Feriados/Férias</div>
      <div class="calendar-card-number">3</div>
      <div class="calendar-card-info">Próximo: 25/12</div>
    </div>
  </div>

  <button class="calendar-toggle-btn" id="calendarToggleBtn" onclick="toggleCalendar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
    Ver Calendário
  </button>

  <!-- Collapsible Calendar Section -->
  <div class="calendar-collapsible" id="calendarCollapsible">
    <div class="calendar-wrapper">
      <!-- Dual Calendar -->
      <div class="dual-calendar-container">
        <h3 class="calendar-heading">Calendário de Ocorrências</h3>
        
        <!-- Legend Chips (inline) -->
        <div class="calendar-legend-inline">
          <span class="legend-chip"><span class="legend-chip-color deslocacao"></span>Deslocações</span>
          <span class="legend-chip"><span class="legend-chip-color medicina"></span>Medicina</span>
          <span class="legend-chip"><span class="legend-chip-color formacao"></span>Formações</span>
          <span class="legend-chip"><span class="legend-chip-color holiday"></span>Feriados</span>
        </div>
        
        <div class="months-container">
          <!-- Current Month -->
          <div class="calendar-month">
            <div class="month-header">
              <button class="nav-arrow" id="prevMonth">◀</button>
              <span id="currentMonthName">Dezembro 2025</span>
              <span style="width: 28px;"></span>
            </div>
            
            <div class="calendar-grid days">
              <p>D</p><p>S</p><p>T</p><p>Q</p><p>Q</p><p>S</p><p>S</p>
            </div>
            
            <div class="calendar-grid" id="currentMonthGrid"></div>
          </div>

          <!-- Next Month -->
          <div class="calendar-month">
            <div class="month-header">
              <span style="width: 28px;"></span>
              <span id="nextMonthName">Janeiro 2026</span>
              <button class="nav-arrow" id="nextMonth">▶</button>
            </div>
            
            <div class="calendar-grid days">
              <p>D</p><p>S</p><p>T</p><p>Q</p><p>Q</p><p>S</p><p>S</p>
            </div>
            
            <div class="calendar-grid" id="nextMonthGrid"></div>
          </div>
        </div>
      </div>

      <!-- Info Panel (Events Only) -->
      <div class="info-panel">
        <div class="events-panel">
          <div class="events-header">
            <div>
              <h3 class="events-title" id="eventsTitle">Próximos Eventos</h3>
              <span class="selected-date-info" id="selectedDateInfo" style="display: none;"></span>
            </div>
            <button class="clear-filter-btn" id="clearFilterBtn" aria-label="Limpar filtro">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
              Limpar
            </button>
          </div>
          
          <div class="events-container-scroll" id="eventsContainer">
            <!-- Events will be populated by JavaScript -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
