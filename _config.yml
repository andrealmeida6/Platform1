# Portal do Colaborador - Jekyll Configuration
# Power Pages Ready Structure

title: "Portal do Colaborador"
description: "Portal interno para colaboradores"
baseurl: "/Platform1"
url: "https://andrealmeida6.github.io"

# Jekyll Settings
markdown: kramdown
theme: null
plugins: []

# IMPORTANTE: Desativar tema default do GitHub Pages
remote_theme: null

# Build settings
exclude:
  - README.md
  - .gitignore
  - node_modules
  - vendor
  - test_permissions.txt
  - Gemfile
  - Gemfile.lock
  - assets
  - snippets

# Include settings  
include:
  - _includes
  - _layouts
  - web-files
  - web-pages

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
