# Portal do Colaborador - Jekyll Configuration
# Power Pages Ready Structure

title: "Portal do Colaborador"
description: "Portal interno para colaboradores - KPMG Portugal / Recuperar Portugal"
baseurl: "/Platform1"
url: "https://andrealmeida6.github.io"

# Jekyll Settings
markdown: kramdown
theme: null
plugins: []

# Build settings
exclude:
  - README.md
  - .gitignore
  - node_modules
  - vendor
  - test_permissions.txt
  - Gemfile
  - Gemfile.lock

# Include settings
include:
  - _includes
  - _layouts
  - snippets
  - web-files
  - web-pages

# Collections (opcional - para futuro)
# collections:
#   components:
#     output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"